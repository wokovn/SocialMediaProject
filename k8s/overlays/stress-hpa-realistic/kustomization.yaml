apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - configmap.yaml
  - secret.yaml
  - ingress.yaml
  - hpa.yaml
labels:
  - pairs:
      env: stress-hpa-realistic

patches:
  - target:
      version: v1
      kind: Service
      name: backend
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
