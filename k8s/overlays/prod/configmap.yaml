apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # ── APP ──
  PORT: "3000"
  NODE_ENV: "production"

  # ── SUPABASE ──
  SUPABASE_URL: "http://host.minikube.internal:54321"
  SUPABASE_JWT_ISSUER: "http://localhost:54321/auth/v1"
  SUPABASE_MEDIA_BUCKET: "media"
  SUPABASE_TMP_PREFIX: "tmp"
  SUPABASE_POST_MEDIA_PREFIX: "post_media"
  SUPABASE_PROFILE_PICTURE_PREFIX: "profile_picture"
  SUPABASE_WEB_CONTENT_PREFIX: "web_content"
  SUPABASE_POST_MEDIA_VARIANTS_PREFIX: "post_media_variants"

  # ── REDIS ──
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # ── FEED & RANKING ──
  RANKING_TIME_DECAY_FACTOR: "1.8"
  RANKING_CMS_BONUS_WEIGHT: "10"
  RANKING_ACTIVE_HOURS: "72"
  RANKING_MAX_HOT_SIZE: "1000"
  RANKING_MAX_COLD_SIZE: "5000"
  RANKING_INTERACTIONS_TTL: "5184000"
  RANKING_CREATED_AT_TTL: "1209600"
  POST_CACHE_TTL: "300"
  POST_CACHE_JITTER: "60"
  RANKING_THROTTLE_SECONDS: "300"
  RANKING_THRESHOLD_PERCENT: "5"
  RANKING_THRESHOLD_MIN_BASE: "20"
  RANKING_DECAY_REFRESH_N: "200"
  RANKING_DECAY_INTERVAL_MS: "3600000"
  RANKING_DECAY_ENQUEUE_DELAY_MS: "50"

  # ── WORKER & QUEUE ──
  WORKER_DEFAULT_CONCURRENCY: "5"
  RANKING_WORKER_CONCURRENCY: "5"
  MEDIA_CLEANUP_CONCURRENCY: "1"
  MEDIA_RESIZE_CONCURRENCY: "3"
  NOTIFICATION_WORKER_CONCURRENCY: "5"
  POST_COMMENT_SYNC_CONCURRENCY: "1"
  POST_SHARE_SYNC_CONCURRENCY: "1"
  POST_LIKE_SYNC_CONCURRENCY: "1"
  POST_FANOUT_CONCURRENCY: "5"
  USER_FOLLOW_SYNC_CONCURRENCY: "1"
  WORKER_LIMITER_MAX: "10"
  WORKER_LIMITER_DURATION_MS: "1000"
  QUEUE_JOB_ATTEMPTS: "3"
  QUEUE_REMOVE_ON_COMPLETE: "100"
  QUEUE_REMOVE_ON_FAIL: "500"
  WORKER_BATCH_SIZE: "500"
  WORKER_SYNC_INTERVAL_MS: "5000"
  MEDIA_CLEANUP_REMOVE_ON_FAIL_COUNT: "200"

  # ── PRESENCE & FEED ──
  IDOL_FOLLOWER_THRESHOLD: "500"
  MAX_FEED_SIZE: "1000"
  PRESENCE_HEARTBEAT_INTERVAL: "30"
  PRESENCE_ONLINE_TTL: "60"
---
apiVersion: v1
kind: ConfigMap
metadata:
