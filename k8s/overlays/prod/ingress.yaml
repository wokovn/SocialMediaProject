apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # ── Load Balancing ──
    # EWMA (Exponential Weighted Moving Average): chọn upstream có latency thấp nhất
    # tự thích nghi, tránh pod đang chậm/overload — tốt nhất cho mixed workload
    # (REST API + media upload + WebSocket)
    nginx.ingress.kubernetes.io/load-balance: "ewma"

    # ── WebSocket support ──
    # Bắt buộc để socket.io hoạt động đúng qua Ingress
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

    # ── Upload size (media) ──
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - my-social-app.com
      secretName: social-app-tls
  rules:
    - host: my-social-app.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
