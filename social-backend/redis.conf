# =============================================================
# Redis Configuration - Social Media Project
# Hybrid Persistence: RDB + AOF (aof-use-rdb-preamble yes)
# =============================================================

# --- Networking ---
bind 0.0.0.0
protected-mode yes

# --- Data directory (mapped to Docker volume /data) ---
dir /data

# =============================================================
# HYBRID PERSISTENCE (RDB + AOF)
# =============================================================

# --- AOF (Append-Only File) ---
appendonly yes
appendfilename "appendonly.aof"

# everysec: flush mỗi giây — cân bằng giữa performance & độ an toàn
# always:   flush mỗi write   — an toàn nhất, chậm hơn
# no:       để OS quyết định  — nhanh nhất, có thể mất ~30s data
appendfsync everysec

# Không fsync khi đang chạy BGSAVE/BGREWRITEAOF (tránh I/O spike)
no-appendfsync-on-rewrite yes

# Auto-rewrite AOF khi file tăng gấp đôi và > 64MB
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# BẬT HYBRID FORMAT: AOF file = RDB preamble + AOF tail
# → Load cực nhanh như RDB, không mất data như AOF
aof-use-rdb-preamble yes

# --- RDB Snapshots ---
# save <seconds> <changes>
# sau 1 giờ nếu có ≥1 write | sau 5 phút nếu ≥100 | sau 1 phút nếu ≥10000 writes
save 3600 1
save 300 100
save 60 10000

dbfilename dump.rdb

# Nén RDB file (tiết kiệm disk)
rdbcompression yes
rdbchecksum yes

# Nếu save thất bại → dừng nhận write để tránh mất data ngầm
stop-writes-on-bgsave-error yes

# =============================================================
# PERFORMANCE
# =============================================================

# Tối đa số client kết nối đồng thời
maxclients 1000

# Giới hạn RAM (0 = không giới hạn)
# maxmemory 512mb
# maxmemory-policy allkeys-lru

# Lazy free cho các lệnh DEL lớn (tránh block event loop)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Log level: debug | verbose | notice | warning
loglevel notice
