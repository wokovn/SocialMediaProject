version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: social_z_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Dùng shell để expand ${REDIS_PASSWORD} từ env rồi truyền vào redis-server
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    env_file:
      - .env
    networks:
      - social_z_network

volumes:
  redis_data:

networks:
  social_z_network:
    driver: bridge